<!doctype html>
<html lang="es">
<head>
  <!-- Vista de registro: formulario para crear una cuenta, indicar la finca y seleccionar un rol. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | TERRABOVINO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<header class="site-header"><nav class="navbar container py-3" aria-label="Navegación principal">
  <a class="navbar-brand d-flex align-items-center" href="PagPrincipal.html"><span class="brand-mark">T</span>TERRABOVINO</a>
  <a class="btn btn-outline-success btn-sm" href="login.html">Ya tengo cuenta</a>
</nav></header>
<main class="section-space">
  <div class="container"><div class="row justify-content-center"><div class="col-12 col-lg-8 col-xl-7">
    <section class="form-card">
      <div class="text-center mb-4"><p class="text-brand fw-semibold mb-2">ÚNETE A TERRABOVINO</p>
        <h1 class="h2 fw-bold">Crear una cuenta</h1><p class="muted">Completa la información para comenzar.</p></div>
      <form action="#" method="post">
        <div class="row g-3">
          <div class="col-12"><label class="form-label" for="nombre">Nombre completo</label>
            <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Ej. Daniel Salas" autocomplete="name" required></div>
          <div class="col-12"><label class="form-label" for="correo">Correo electrónico</label>
            <input class="form-control" type="email" id="correo" name="correo" placeholder="nombre@correo.com" autocomplete="email" required></div>
          <div class="col-md-6"><label class="form-label" for="contrasena">Contraseña</label>
            <input class="form-control" type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña" autocomplete="new-password" required></div>
          <div class="col-md-6"><label class="form-label" for="confirmar">Confirmar contraseña</label>
            <input class="form-control" type="password" id="confirmar" name="confirmar" placeholder="Repite la contraseña" autocomplete="new-password" required></div>
          <div class="col-12"><label class="form-label" for="finca">Nombre de la finca <span class="muted fw-normal">(opcional)</span></label>
            <input class="form-control" type="text" id="finca" name="finca" placeholder="Ej. Finca El Recuerdo"></div>
          <div class="col-12"><label class="form-label" for="rol">Selecciona tu rol</label>
            <select class="form-select" id="rol" name="rol" required>
              <option value="" selected disabled>Elige una opción</option>
              <option value="ganadero">Ganadero</option><option value="veterinario">Veterinario</option>
              <option value="trabajador">Trabajador</option><option value="administrador">Administrador</option>
            </select></div>
          <div class="col-12"><div class="form-check">
            <input class="form-check-input" type="checkbox" id="terminos" name="terminos" required>
            <label class="form-check-label" for="terminos">Acepto los términos y condiciones de uso.</label>
          </div></div>
          <div class="col-12"><button class="btn btn-success w-100 py-2" type="submit">Crear cuenta</button></div>
        </div>
      </form>
      <p class="text-center muted mt-4 mb-0">¿Ya estás registrado? <a href="login.html" class="fw-semibold">Inicia sesión</a></p>
      <p class="small text-center muted mt-3 mb-0">Formulario de presentación. El registro real requiere backend y base de datos.</p>
    </section>
  </div></div></div>
</main>
<footer class="py-3 text-center small muted">© 2026 TERRABOVINO · Proyecto académico</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
